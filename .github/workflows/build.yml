name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v-prefixed tag to build'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: build-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\cache
          key: pip-${{ runner.os }}-${{ hashFiles('source/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements.txt

      - name: Determine version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v[0-9][A-Za-z0-9._-]*$') { throw "Expected an existing v-prefixed release tag: $tag" }
          git rev-parse --verify "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Tag does not exist: $tag" }
          $ver = $tag.Substring(1)
          Write-Host "tag=$tag ver=$ver"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ver=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build with PyInstaller
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File source/scripts/build_exe.ps1

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = "release/candidate/MediaTranscriberSuite/MediaTranscriberSuite.exe"
          if (-not (Test-Path $exe)) { throw "Build output missing: $exe" }
          Write-Host "exe present: $exe"

      - name: Create zip
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.ver }}
        run: |
          $zip = "MediaTranscriberSuite-$env:RELEASE_VERSION-win64.zip"
          $destination = Join-Path (Resolve-Path release/candidate) $zip
          Compress-Archive -Path "release/candidate/MediaTranscriberSuite", "start_media_suite.bat" -DestinationPath $destination -CompressionLevel Optimal -Force
          $item = Get-Item $destination
          Write-Host "created $($item.Name) size=$([math]::Round($item.Length/1MB,1))MB"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaTranscriberSuite-win64
          path: release/candidate/MediaTranscriberSuite-${{ steps.version.outputs.ver }}-win64.zip
          if-no-files-found: error

      - name: Publish release with zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_ZIP: ${{ steps.version.outputs.ver }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $zip = "MediaTranscriberSuite-$env:RELEASE_ZIP-win64.zip"
          $file = "release/candidate/$zip"
          if (-not (Test-Path $file)) { throw "Missing release asset: $file" }
          # gh release upload --clobber makes a rerun idempotent, and gh release
          # create works whether the tag was pushed directly or via dispatch.
          $release = gh release view $tag --json id 2>&1
          if ($LASTEXITCODE -ne 0) {
            if (($release | Out-String) -notmatch 'release not found') { throw "Failed to check release: $release" }
            gh release create $tag --verify-tag --draft --title "Media Transcriber Suite $tag" --notes "Windows build: unzip the archive, then run start_media_suite.bat (keep the _internal directory alongside the executable)."
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft release' }
          }
          gh release upload $tag $file --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release' }
