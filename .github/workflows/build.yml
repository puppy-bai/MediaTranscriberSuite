name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\cache
          key: pip-${{ runner.os }}-${{ hashFiles('source/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements.txt

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = 'dev' }
          $ver = $tag.TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = 'dev' }
          Write-Host "tag=$tag ver=$ver"
          Write-Output "tag=$tag"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "ver=$ver"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "zip=MediaTranscriberSuite-$ver-win64.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build with PyInstaller
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File source/scripts/build_exe.ps1

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = "release/candidate/MediaTranscriberSuite/MediaTranscriberSuite.exe"
          if (-not (Test-Path $exe)) { throw "Build output missing: $exe" }
          Write-Host "exe present: $exe"

      - name: Create zip
        working-directory: release/candidate
        shell: pwsh
        run: |
          $zip = "MediaTranscriberSuite-${{ steps.version.outputs.ver }}-win64.zip"
          Compress-Archive -Path "MediaTranscriberSuite" -DestinationPath $zip -CompressionLevel Optimal -Force
          $item = Get-Item $zip
          Write-Host "created $($item.Name) size=$([math]::Round($item.Length/1MB,1))MB"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaTranscriberSuite-win64
          path: release/candidate/MediaTranscriberSuite-${{ steps.version.outputs.ver }}-win64.zip
          if-no-files-found: error

      - name: Get or create draft release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $owner = ($env:GITHUB_REPOSITORY -split '/')[0]
          $repo  = ($env:GITHUB_REPOSITORY -split '/')[1]
          $tag   = "${{ steps.version.outputs.tag }}"
          $headers = @{
            "Authorization" = "Bearer $env:GH_TOKEN"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $apiRoot = "https://api.github.com/repos/$owner/$repo"
          Write-Host "tag=$tag repository=$owner/$repo"

          # Reuse an existing release for this tag (e.g. its draft created already),
          # otherwise create a fresh draft before uploading the asset.
          $existing = $null
          try {
            $existing = Invoke-RestMethod -Uri "$apiRoot/releases/tags/$tag" -Headers $headers -Method Get -ErrorAction Stop
          } catch { $existing = $null }

          if ($existing) {
            Write-Host "reusing release id=$($existing.id)"
            Write-Output "release_id=$($existing.id)"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Output "created=false"                 | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            $req = @{
              tag_name = $tag
              name = "Media Transcriber Suite $tag"
              body = "Automatically built by GitHub Actions. Unpack the whole MediaTranscriberSuite folder after downloading (the exe needs the adjacent _internal directory)."
              draft = $true
              prerelease = $false
            } | ConvertTo-Json
            $rel = Invoke-RestMethod -Uri "$apiRoot/releases" -Headers $headers -Method Post -Body $req -ContentType "application/json"
            Write-Host "created draft id=$($rel.id)"
            Write-Output "release_id=$($rel.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Output "created=true"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Upload zip to release
        shell: pwsh
        working-directory: release/candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $owner = ($env:GITHUB_REPOSITORY -split '/')[0]
          $repo  = ($env:GITHUB_REPOSITORY -split '/')[1]
          $id    = "${{ steps.release.outputs.release_id }}"
          $zip   = "MediaTranscriberSuite-${{ steps.version.outputs.ver }}-win64.zip"
          $uploadUrl = "https://uploads.github.com/repos/$owner/$repo/releases/$id/assets?name=$([uri]::EscapeDataString($zip))"
          Write-Host "uploading $zip to $uploadUrl"
          curl.exe -sS --fail --max-time 3600 `
            -H "Authorization: Bearer $env:GH_TOKEN" `
            -H "Accept: application/vnd.github+json" `
            -H "X-GitHub-Api-Version: 2022-11-28" `
            -H "Content-Type: application/zip" `
            --data-binary "@$($PWD.Path)\$zip" `
            "$uploadUrl"
          Write-Host "upload finished"

      - name: Publish release (un-draft)
        shell: pwsh
        if: steps.release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $owner = ($env:GITHUB_REPOSITORY -split '/')[0]
          $repo  = ($env:GITHUB_REPOSITORY -split '/')[1]
          $id    = "${{ steps.release.outputs.release_id }}"
          $headers = @{
            "Authorization" = "Bearer $env:GH_TOKEN"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $req = @{ draft = $false } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/$owner/$repo/releases/$id" -Headers $headers -Method Patch -Body $req -ContentType "application/json" | Out-Null
          Write-Host "release published"